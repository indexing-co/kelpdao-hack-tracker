# Render service definition for the KelpDAO Hack Tracker dashboard.
#
# How this works:
# 1. Connect this repo to Render via the web UI (one-time, see DEPLOY.md).
# 2. Render reads this file and provisions the service automatically.
# 3. Set DATABASE_URL as a secret in the Render UI (never commit it).
# 4. Future pushes to main auto-deploy.

services:
  - type: web
    name: kelpdao-hack-tracker
    runtime: node
    rootDir: dashboard
    plan: starter
    region: frankfurt # change to 'oregon' / 'singapore' / 'ohio' if preferred
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # set manually in Render UI — pooled Neon URL
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    # Custom domain optional. Configure either here or via Render UI after first deploy.
    # domains:
    #   - observatory.indexing.co
